[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "originchain-core"
version = "0.1.0"
description = "Reference cryptographic core for the OriginChain provenance protocol"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

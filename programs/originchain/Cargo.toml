[package]
name = "originchain-program"
version = "0.1.0"
description = "Solana registry for OriginChain asset identities and immutable versions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "originchain_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

[dev-dependencies]
litesvm = "0.18.0"
solana-instruction = "4"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
